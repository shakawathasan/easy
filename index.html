<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>SohoJ Clinic — Smart Queue &amp; Pre-Check</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#F6F9F8;
  --surface:#FFFFFF;
  --surface-2:#EEF4F3;
  --text:#132321;
  --text-dim:#5B6E6B;
  --border:#DCE6E3;
  --teal:#0E6E67;
  --teal-dark:#0A4F4A;
  --teal-tint:#E3F2EF;
  --blue:#2E6BA6;
  --blue-tint:#E7F0F9;
  --success:#2F8558;
  --success-tint:#E5F5EC;
  --warning:#B9791C;
  --warning-tint:#FBF0DE;
  --danger:#C0392B;
  --danger-tint:#FBEAE8;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:22px;
  --shadow:0 1px 2px rgba(19,35,33,.06), 0 6px 20px rgba(19,35,33,.05);
  --font: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0F1715;
    --surface:#17211F;
    --surface-2:#1D2926;
    --text:#EAF2F0;
    --text-dim:#93A7A3;
    --border:#2A3835;
    --teal:#3FBDB2;
    --teal-dark:#7EE0D6;
    --teal-tint:#173230;
    --blue:#7FB2E0;
    --blue-tint:#152A38;
    --success:#5FC98B;
    --success-tint:#123527;
    --warning:#E3B15E;
    --warning-tint:#3A2C10;
    --danger:#E8877B;
    --danger-tint:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1715;
  --surface:#17211F;
  --surface-2:#1D2926;
  --text:#EAF2F0;
  --text-dim:#93A7A3;
  --border:#2A3835;
  --teal:#3FBDB2;
  --teal-dark:#7EE0D6;
  --teal-tint:#173230;
  --blue:#7FB2E0;
  --blue-tint:#152A38;
  --success:#5FC98B;
  --success-tint:#123527;
  --warning:#E3B15E;
  --warning-tint:#3A2C10;
  --danger:#E8877B;
  --danger-tint:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
body.big-text{font-size:19px;}
body.big-text h1{font-size:2.1em;}
body.high-contrast{--bg:#FFFFFF;--surface:#FFFFFF;--text:#000000;--text-dim:#000000;--border:#000000;--teal:#00524A;--teal-tint:#DFF3EF;}
img,svg{max-width:100%;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
a{color:var(--teal);}
.app{max-width:980px;margin:0 auto;padding:16px 16px 64px;min-height:100vh;}
.app.wide{max-width:1180px;}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.brand-text{text-align:left;}
.brand-name{font-weight:800;font-size:17px;color:var(--text);line-height:1.15;}
.brand-sub{font-size:11.5px;color:var(--text-dim);}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);}
.lang-toggle button{border:none;background:none;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--text-dim);cursor:pointer;}
.lang-toggle button.active{background:var(--teal);color:#fff;}

.icon-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.chip-btn{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;}
.chip-btn.on{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:none;padding:13px 20px;font-size:15.5px;font-weight:700;cursor:pointer;transition:transform .08s ease;font-family:inherit;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--teal);padding:10px 6px;}
.btn-block{width:100%;}
.btn-lg{padding:18px 22px;font-size:17px;border-radius:16px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.section-title{font-size:13px;font-weight:700;color:var(--text-dim);margin:26px 0 10px;padding-left:2px;}
.section-title:first-child{margin-top:4px;}

/* home hero */
.hero{text-align:center;padding:22px 6px 6px;}
.hero h1{font-size:1.7em;margin:0 0 8px;font-weight:800;letter-spacing:-.01em;}
.hero p{color:var(--text-dim);margin:0 0 22px;font-size:15px;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:480px){.home-grid{grid-template-columns:1fr;}}
.home-tile{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:22px 16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;}
.home-tile:hover{border-color:var(--teal);}
.home-tile .emoji{font-size:30px;}
.home-tile .label{font-weight:700;font-size:15px;}
.home-tile .desc{font-size:12.5px;color:var(--text-dim);}

/* forms */
.field{margin-bottom:16px;}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;}
.field .hint{font-size:12.5px;color:var(--text-dim);margin-top:5px;}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:15.5px;font-family:inherit;
}
textarea{min-height:80px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.grid2{grid-template-columns:1fr;}}
.pill-select{display:flex;flex-wrap:wrap;gap:8px;}
.pill-select button{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;}
.pill-select button.sel{background:var(--teal);border-color:var(--teal);color:#fff;}
.upload-box{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;}
.upload-box:hover{border-color:var(--teal);}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;}

/* stepper */
.steps{display:flex;gap:6px;margin-bottom:20px;}
.steps div{flex:1;height:5px;border-radius:4px;background:var(--border);}
.steps div.done{background:var(--teal);}

/* status badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.badge-waiting{background:var(--blue-tint);color:var(--blue);}
.badge-called{background:var(--warning-tint);color:var(--warning);}
.badge-progress{background:var(--teal-tint);color:var(--teal-dark);}
.badge-done{background:var(--success-tint);color:var(--success);}
.badge-missed{background:var(--danger-tint);color:var(--danger);}
.badge-urgent{background:var(--danger);color:#fff;}
.badge-priority{background:var(--warning-tint);color:var(--warning);}

/* token display */
.token-hero{text-align:center;padding:26px 16px;background:linear-gradient(160deg,var(--teal-tint),var(--surface));border-radius:var(--radius-lg);border:1px solid var(--border);}
.token-num{font-size:52px;font-weight:800;color:var(--teal-dark);letter-spacing:.01em;line-height:1;}
.token-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.token-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
.token-stat b{display:block;font-size:20px;}
.token-stat span{font-size:12px;color:var(--text-dim);}

/* alerts */
.alert{border-radius:12px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;}
.alert-urgent{background:var(--danger-tint);color:var(--danger);border:1.5px solid var(--danger);}
.alert-info{background:var(--blue-tint);color:var(--blue);}
.alert-success{background:var(--success-tint);color:var(--success);}

/* queue list rows */
.qrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.qrow:last-child{border-bottom:none;}
.qtoken{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
.qmain{flex:1;min-width:0;}
.qname{font-weight:700;font-size:14.5px;}
.qmeta{font-size:12.5px;color:var(--text-dim);}
.qactions{display:flex;gap:6px;flex-wrap:wrap;}
.small-btn{border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text);}
.small-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.small-btn.danger{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto;}
.tabs button{flex:1;white-space:nowrap;border:none;background:none;padding:10px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
.tabs button.active{background:var(--surface);color:var(--teal-dark);box-shadow:var(--shadow);}

/* login */
.login-wrap{max-width:400px;margin:40px auto;}
.demo-acc{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text-dim);margin-top:14px;line-height:1.7;}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;}
.stat-card .v{font-size:24px;font-weight:800;color:var(--teal-dark);}
.stat-card .l{font-size:12px;color:var(--text-dim);margin-top:2px;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-label{width:100px;font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
.bar-track{flex:1;height:16px;background:var(--surface-2);border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;background:var(--teal);border-radius:8px;}
.bar-val{width:36px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0;}

.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.timeline-item:last-child{border-bottom:none;}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:5px;flex-shrink:0;}
.tl-date{font-size:12px;color:var(--text-dim);}
.tl-title{font-weight:700;font-size:14px;}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
@media (min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow:auto;}
@media (min-width:640px){.modal{border-radius:20px;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:17px;}

.empty{text-align:center;padding:40px 16px;color:var(--text-dim);}
.empty .em{font-size:34px;margin-bottom:8px;}

.footer-note{text-align:center;font-size:11.5px;color:var(--text-dim);margin-top:40px;padding:0 20px;line-height:1.6;}
.skiplink{position:fixed;top:-40px;left:8px;background:var(--teal);color:#fff;padding:8px 12px;border-radius:8px;z-index:100;}
.skiplink:focus{top:8px;}
.voice-btn{background:var(--teal-tint);color:var(--teal-dark);border:none;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-box{background:var(--teal-tint);border:1px solid var(--teal);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;}
.doc-thumb{background:var(--surface-2);border-radius:10px;padding:10px;font-size:12px;text-align:center;}
.log-row{font-size:12.5px;color:var(--text-dim);padding:7px 0;border-bottom:1px solid var(--border);}
.log-row:last-child{border-bottom:none;}
.priority-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}

/* connection status */
.conn-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.conn-online{background:var(--success-tint);color:var(--success);}
.conn-offline{background:var(--danger-tint);color:var(--danger);}
.conn-reconnecting{background:var(--warning-tint);color:var(--warning);}
.conn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.conn-dot.pulse{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.sync-note{font-size:11px;color:var(--text-dim);text-align:center;padding:4px 0 10px;}

/* waiting room display */
.wr-wrap{background:var(--teal-dark);color:#fff;min-height:100vh;margin:-16px -16px -64px;padding:28px 20px 40px;}
.wr-clinic{text-align:center;font-size:15px;opacity:.85;margin-bottom:18px;font-weight:600;}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:0 auto;}
@media (max-width:640px){.wr-grid{grid-template-columns:1fr;}}
.wr-card{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.25);border-radius:22px;padding:24px;text-align:center;}
.wr-label{font-size:14px;letter-spacing:.12em;opacity:.75;font-weight:700;margin-bottom:10px;}
.wr-token{font-size:64px;font-weight:800;line-height:1;}
.wr-doc{margin-top:12px;font-size:15px;opacity:.9;}
.wr-next{opacity:.75;}
.wr-next .wr-token{font-size:40px;}

/* offline relay */
.relay-code{font-size:38px;font-weight:800;letter-spacing:.08em;text-align:center;padding:18px;background:var(--teal-tint);color:var(--teal-dark);border-radius:14px;}
.your-turn-flash{position:fixed;inset:0;background:var(--teal-dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;text-align:center;padding:20px;}
.your-turn-flash .big{font-size:56px;font-weight:800;margin:14px 0;}
.perm-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--danger);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.25);}
</style>
</head>

<script>

/* ============================== LOCAL WI-FI RELAY (item: receptionist offline relay) ==============================
   Real peer-to-peer over the clinic's local Wi-Fi/hotspot, no internet required.
   Uses WebRTC with only local-network ("host") ICE candidates — no STUN/TURN server,
   so it needs no internet even to establish the connection, unlike most WebRTC demos.
   Signaling (exchanging the connection info) is manual copy/paste since there's no
   internet to run a signaling server either — this is the physical-proximity step,
   same idea as the earlier manual code, but once connected, updates flow live and
   automatically instead of needing a new code each time.
   CAVEAT (stated honestly, not detectable from JS): this needs the Wi-Fi/hotspot to
   allow device-to-device ("peer") traffic. Many phone hotspots and most guest/enterprise
   networks block that ("client/AP isolation") — a plain home/office router usually
   allows it. If pairing hangs at "Waiting for connection...", that's almost always why. */
let relayPC = null, relayChannel = null;
function relayResetLocal(){ try{ relayChannel && relayChannel.close(); }catch(e){} try{ relayPC && relayPC.close(); }catch(e){} relayPC=null; relayChannel=null; state.localRelay = {role:null, status:'idle', offerCode:'', answerCode:'', receivedCode:'', tokenId:'', received:null}; }
async function waitIceComplete(pc){
  if(pc.iceGatheringState==='complete') return;
  await new Promise(resolve=>{
    function check(){ if(pc.iceGatheringState==='complete'){ pc.removeEventListener('icegatheringstatechange', check); resolve(); } }
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 3000); // don't hang forever if gathering stalls
  });
}
function relayPayloadFromDoc(doc){
  if(!doc) return null;
  const {ahead} = positionInQueue(doc);
  const doctor = getAll('doctors').find(d=>d.id===doc.doctorId);
  return { token:doc.token, status:doc.status, ahead, doctor: doctor ? (LANG==='bn'?doctor.nameBn:doctor.name) : '', room: doctor?doctor.room:'', at: nowISO() };
}
function relayBroadcastIfPaired(collection, id, doc){
  if(collection!=='queue' || !relayChannel || relayChannel.readyState!=='open') return;
  if(!state.localRelay || state.localRelay.tokenId!==id) return;
  const payload = relayPayloadFromDoc(doc || findQueueEntry(id));
  if(payload){ try{ relayChannel.send(JSON.stringify(payload)); }catch(e){} }
}
async function relayHostStart(tokenId){
  relayResetLocal();
  state.localRelay = {role:'host', status:'connecting', offerCode:'', answerCode:'', receivedCode:'', tokenId, received:null};
  render();
  relayPC = new RTCPeerConnection({iceServers:[]});
  relayChannel = relayPC.createDataChannel('clinicRelay');
  relayChannel.onopen = ()=>{ state.localRelay.status='connected'; const p=relayPayloadFromDoc(findQueueEntry(tokenId)); if(p){ try{relayChannel.send(JSON.stringify(p));}catch(e){} } render(); };
  relayChannel.onclose = ()=>{ state.localRelay.status='closed'; render(); };
  const offer = await relayPC.createOffer();
  await relayPC.setLocalDescription(offer);
  await waitIceComplete(relayPC);
  state.localRelay.offerCode = btoa(JSON.stringify(relayPC.localDescription));
  state.localRelay.status = 'awaiting-answer';
  render();
}
async function relayHostApplyAnswer(answerCodeRaw){
  try{
    const answer = JSON.parse(atob(answerCodeRaw.trim()));
    await relayPC.setRemoteDescription(answer);
    state.localRelay.status = 'connecting';
    render();
  }catch(e){ alert(LANG==='bn'?'কোডটি সঠিক নয়।':'That code doesn\u2019t look valid.'); }
}
async function relayGuestJoin(offerCodeRaw){
  relayResetLocal();
  state.localRelay = {role:'guest', status:'connecting', offerCode:'', answerCode:'', receivedCode:'', tokenId:'', received:null};
  render();
  try{
    const offer = JSON.parse(atob(offerCodeRaw.trim()));
    relayPC = new RTCPeerConnection({iceServers:[]});
    relayPC.ondatachannel = (e)=>{
      relayChannel = e.channel;
      relayChannel.onopen = ()=>{ state.localRelay.status='connected'; render(); };
      relayChannel.onclose = ()=>{ state.localRelay.status='closed'; render(); };
      relayChannel.onmessage = (ev)=>{ try{ state.localRelay.received = JSON.parse(ev.data); }catch(e){} render(); };
    };
    await relayPC.setRemoteDescription(offer);
    const answer = await relayPC.createAnswer();
    await relayPC.setLocalDescription(answer);
    await waitIceComplete(relayPC);
    state.localRelay.answerCode = btoa(JSON.stringify(relayPC.localDescription));
    state.localRelay.status = 'awaiting-connection';
    render();
  }catch(e){ alert(LANG==='bn'?'কোডটি সঠিক নয়।':'That code doesn\u2019t look valid.'); state.localRelay.status='idle'; render(); }
}

/* ---- tiny IndexedDB wrapper for the offline pending-write queue ---- */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('clinic_offline_db', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', {keyPath:'qid', autoIncrement:true});
      if(!db.objectStoreNames.contains('cache')) db.createObjectStore('cache', {keyPath:'key'});
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbAdd(storeName, value){
  try{ const db = await idbOpen(); return new Promise((res,rej)=>{
    const tx = db.transaction(storeName,'readwrite'); tx.objectStore(storeName).add(value);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });}catch(e){ return false; }
}
async function idbPut(storeName, value){
  try{ const db = await idbOpen(); return new Promise((res,rej)=>{
    const tx = db.transaction(storeName,'readwrite'); tx.objectStore(storeName).put(value);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });}catch(e){ return false; }
}
async function idbGetAll(storeName){
  try{ const db = await idbOpen(); return new Promise((res,rej)=>{
    const tx = db.transaction(storeName,'readonly'); const r = tx.objectStore(storeName).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  });}catch(e){ return []; }
}
async function idbDelete(storeName, key){
  try{ const db = await idbOpen(); return new Promise((res,rej)=>{
    const tx = db.transaction(storeName,'readwrite'); tx.objectStore(storeName).delete(key);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });}catch(e){ return false; }
}
async function queueOffline(op){
  await idbAdd('pending', Object.assign({at: nowISO()}, op));
  connState.pendingCount = (await idbGetAll('pending')).length;
}
async function flushOfflineQueue(){
  if(!dbc) return;
  const items = await idbGetAll('pending');
  if(!items.length){ setConn('online'); touchSync(); return; }
  for(const item of items){
    try{
      if(item.kind==='upsert') await dbc.from('docs').upsert({collection:item.collection, id:item.id, data:item.data});
      else if(item.kind==='delete') await dbc.from('docs').delete().eq('collection',item.collection).eq('id',item.id);
      await idbDelete('pending', item.qid);
    }catch(e){ setConn('offline'); return; } // stop, retry later
  }
  connState.pendingCount = 0;
  setConn('online'); touchSync();
  render();
}

/* ---- generic CRUD over the single `docs` table, with idempotent upsert ---- */
function col(name){ return { _name:name }; }

// `explicitId`: pass a stable, client-generated id to make retries/double-taps
// idempotent (a second call with the same id overwrites the same row instead of
// creating a duplicate). If omitted, a fresh id is generated.
async function addDoc(name, data, explicitId){
  const id = explicitId || uid();
  const doc = Object.assign({id}, data);
  await upsertDoc(name, id, doc);
  return doc;
}
async function upsertDoc(name, id, doc){
  relayBroadcastIfPaired(name, id, doc);
  // optimistic local update so the UI (and idempotent re-submits) feel instant
  if(dbc){
    const arr = LOCAL_CACHE[name] = LOCAL_CACHE[name]||[];
    const i = arr.findIndex(x=>x.id===id);
    if(i>-1) arr[i]=Object.assign({},arr[i],doc); else arr.push(doc);
    try{
      const { error } = await dbc.from('docs').upsert({collection:name, id, data:doc});
      if(error) throw error;
      touchSync(); if(connState.status!=='online') setConn('online');
    }catch(e){
      await queueOffline({kind:'upsert', collection:name, id, data:doc});
      setConn(navigator.onLine ? 'reconnecting' : 'offline');
    }
  } else {
    LOCAL[name] = LOCAL[name]||[];
    const i = LOCAL[name].findIndex(x=>x.id===id);
    if(i>-1) LOCAL[name][i]=doc; else LOCAL[name].push(doc);
    persistLocalFallback();
  }
  render();
}
async function updateDoc(name, id, patch){
  const arr = getAll(name);
  const existing = arr.find(x=>x.id===id) || {id};
  const merged = Object.assign({}, existing, patch);
  await upsertDoc(name, id, merged);
}
async function deleteDocById(name, id){
  if(dbc){
    LOCAL_CACHE[name] = (LOCAL_CACHE[name]||[]).filter(x=>x.id!==id);
    try{
      const { error } = await dbc.from('docs').delete().eq('collection',name).eq('id',id);
      if(error) throw error;
      touchSync();
    }catch(e){ await queueOffline({kind:'delete', collection:name, id}); setConn(navigator.onLine?'reconnecting':'offline'); }
  } else {
    LOCAL[name] = (LOCAL[name]||[]).filter(x=>x.id!==id);
    persistLocalFallback();
  }
  render();
}
function getAll(name){
  if(dbc) return LOCAL_CACHE[name] || [];
  return LOCAL[name] || [];
}

function watchAll(){
  if(!dbc) return;
  try{
    realtimeChannel = dbc.channel('docs-changes')
      .on('postgres_changes', {event:'*', schema:'public', table:'docs'}, payload=>{
        const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
        if(!row) return;
        const { collection, id } = row;
        if(!LOCAL_CACHE[collection]) LOCAL_CACHE[collection]=[];
        if(payload.eventType==='DELETE'){
          LOCAL_CACHE[collection] = LOCAL_CACHE[collection].filter(x=>x.id!==id);
        } else {
          const doc = Object.assign({id}, payload.new.data);
          const i = LOCAL_CACHE[collection].findIndex(x=>x.id===id);
          if(i>-1) LOCAL_CACHE[collection][i]=doc; else LOCAL_CACHE[collection].push(doc);
          if(collection==='__settings__' && id==='app'){ SETTINGS = Object.assign(defaultSettings(), doc); }
        }
        touchSync();
        onRealtimeChange(collection, payload);
        render();
      })
      .subscribe(status=>{
        if(status==='SUBSCRIBED'){ setConn('online'); touchSync(); flushOfflineQueue(); }
        else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){ setConn('reconnecting'); setTimeout(()=>{ if(dbc) watchAll(); }, 4000); }
        else if(status==='CLOSED'){ setConn(navigator.onLine?'reconnecting':'offline'); }
      });
  }catch(e){ console.error('realtime subscribe failed', e); }
}

function urgentCheck(vitals, symptomsText){
  const reasons = [];
  const temp = parseFloat(vitals.temp);
  const hr = parseFloat(vitals.hr);
  const spo2 = parseFloat(vitals.spo2);
  const bp = (vitals.bp||'').split('/').map(x=>parseFloat(x));
  if(!isNaN(temp) && temp>=103) reasons.push('very high temperature');
  if(!isNaN(spo2) && spo2>0 && spo2<92) reasons.push('low oxygen level');
  if(!isNaN(hr) && (hr>=140 || (hr>0 && hr<=40))) reasons.push('abnormal heart rate');
  if(bp.length===2 && !isNaN(bp[0]) && !isNaN(bp[1])){
    if(bp[0]>=180 || bp[0]<=85) reasons.push('abnormal blood pressure');
  }
  const redFlags = ['chest pain','difficulty breathing','can\'t breathe','severe bleeding','unconscious','seizure','stroke','severe pain','can not breathe','breathless','faint'];
  const txt = (symptomsText||'').toLowerCase();
  redFlags.forEach(f=>{ if(txt.includes(f)) reasons.push('symptom: '+f); });
  return {urgent: reasons.length>0, reasons};
}

function computeQueueForDoctor(doctorId){
  return getAll('queue').filter(q=>q.doctorId===doctorId && ['waiting','called','paused'].includes(q.status))
    .sort((a,b)=>{
      const pw = {emergency:0, disability:1, pregnant:1, elderly:1, child:1, other:2, normal:3};
      const pa = pw[a.priority] ?? 3, pb = pw[b.priority] ?? 3;
      if(pa!==pb) return pa-pb;
      return new Date(a.createdAt) - new Date(b.createdAt);
    });
}
function positionInQueue(entry){
  const q = computeQueueForDoctor(entry.doctorId);
  const idx = q.findIndex(x=>x.id===entry.id);
  return {position: idx, ahead: Math.max(idx,0), total:q.length};
}
function etaFor(entry){
  const doctor = getAll('doctors').find(d=>d.id===entry.doctorId) || {avgConsultMin:12};
  const {ahead} = positionInQueue(entry);
  const low = ahead*doctor.avgConsultMin;
  const high = low + doctor.avgConsultMin + 10;
  return {low, high};
}
function todaysTokensForDoctor(doctorId){
  return getAll('queue').filter(q=>q.doctorId===doctorId && (q.createdAt||'').slice(0,10)===todayKey());
}
function genToken(doctorId){
  const doctor = getAll('doctors').find(d=>d.id===doctorId) || {};
  const prefix = doctor.tokenPrefix || doctor.name?.replace('Dr. ','').charAt(0).toUpperCase() || 'X';
  const start = Number.isFinite(doctor.tokenStart) ? doctor.tokenStart : 1;
  const digits = doctor.tokenDigits || 2;
  const n = todaysTokensForDoctor(doctorId).length + start;
  return prefix + '-' + String(n).padStart(digits,'0');
}
function dailyLimitReached(doctorId){
  const doctor = getAll('doctors').find(d=>d.id===doctorId) || {};
  if(!doctor.dailyLimit) return false;
  return todaysTokensForDoctor(doctorId).length >= doctor.dailyLimit;
}

let lastKnownStatus = {}; // queueEntryId -> status, to detect transitions
let notifPermAsked = false;
async function ensureNotifPermission(){
  if(!('Notification' in window)) return false;
  if(Notification.permission==='granted') return true;
  if(Notification.permission==='denied') return false;
  if(notifPermAsked) return false;

  try{ const p = await Notification.requestPermission(); return p==='granted'; }catch(e){ return false; }
}
function vibrateShort(){ try{ if(navigator.vibrate) navigator.vibrate(2500); }catch(e){} }
function fireNotification(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body, tag:'clinic-queue'});
    }
  }catch(e){}
}
function onRealtimeChange(collection){

function checkOwnTokenNotifications(){
  if(!state.activeTokenId) return;
  const entry = getAll('queue').find(q=>q.id===state.activeTokenId);
  if(!entry) return;
  const prev = lastKnownStatus[entry.id];
  lastKnownStatus[entry.id] = entry.status;
  const threshold = SETTINGS.nearTurnThreshold || CONFIG.NEAR_TURN_DEFAULT;
  const stopStatuses = ['in-consult','completed','noshow','cancelled','skipped'];
  if(stopStatuses.includes(entry.status)) return; // no more notifications once consultation starts/ends
  if(entry.status==='called' && prev!=='called'){
    vibrateShort();
    fireNotification(LANG==='bn' ? 'আপনার পালা!' : 'YOUR TURN', (LANG==='bn'?'টোকেন ':'Token ') + entry.token);
    state.yourTurnFlash = entry.token; render();
    return;
  }
  if(['waiting','paused'].includes(entry.status)){
    const {ahead} = positionInQueue(entry);
    if(ahead<=threshold && ahead>0 && lastKnownStatus['__ahead_'+entry.id] !== ahead){
      lastKnownStatus['__ahead_'+entry.id] = ahead;
      fireNotification(LANG==='bn'?'সিরিয়াল কাছাকাছি':'Almost your turn', T('almostTurn',{n:ahead}));
    }
  }
}

async function buildAISummary(pc, patientName){

  if(!pc.meds) missing.push('current medications (or confirmation of none)');
  if(!pc.allergies) missing.push('allergies (or confirmation of none)');
  const urgent = urgentCheck(pc.vitals, pc.symptoms + ' ' + (pc.reason||''));
  const base = `Patient: ${patientName}
Main complaint: ${pc.symptoms || '—'}
Duration: ${pc.durationDays || '—'} day(s)
Temperature: ${pc.vitals.temp ? pc.vitals.temp+'°F' : 'not provided'}
Blood pressure: ${pc.vitals.bp || 'not provided'}
Heart rate: ${pc.vitals.hr ? pc.vitals.hr+' bpm' : 'not provided'}
Oxygen level: ${pc.vitals.spo2 ? pc.vitals.spo2+'%' : 'not provided'}
Previous reports: ${pc.reportCount || 0} uploaded
Current medication: ${pc.meds || 'None reported'}
Allergy: ${pc.allergies || 'None reported'}
Reason for visit: ${pc.reason || '—'}
Missing information: ${missing.length ? missing.join(', ') : 'none noted'}
Potentially urgent (flagged for doctor review, not a diagnosis): ${urgent.urgent ? urgent.reasons.join(', ') : 'none flagged'}`;
  if(!sampleFn) return base;
  try{
    const prompt = `You organize patient pre-check intake into a short, calm, structured summary for a doctor. Do NOT diagnose, do NOT suggest treatment, do NOT speculate beyond what was given. Just organize the facts clearly in under 90 words, plain text, no markdown.

Patient data:
${base}`;
    const res = await sampleFn(prompt, {modelTier:'quick'});
    return (res && res.text) ? res.text.trim() : base;
  }catch(e){ return base; }
}

/* Token creation is deliberately NOT run through the generic offline queue:
   item 13 requires that if we can't confirm a new token with the server, we
   say "Token not confirmed" rather than show a token that might collide with
   one another offline device also generates for the same doctor. Status
   changes on an *existing* token (call/complete/pause/etc.) are safe to queue
   offline since they don't need a fresh serial number. */
async function createQueueToken(doctorId, payload, requestId){
  if(dailyLimitReached(doctorId)) return {ok:false, reason:'limit'};
  if(dbc && !navigator.onLine) return {ok:false, reason:'offline'};
  const token = genToken(doctorId);
  const doc = Object.assign({id:requestId, token, doctorId, createdAt: nowISO()}, payload);
  if(dbc){
    try{
      const { error } = await dbc.from('docs').upsert({collection:'queue', id:requestId, data:doc});
      if(error) throw error;
      LOCAL_CACHE.queue = LOCAL_CACHE.queue||[];
      const i = LOCAL_CACHE.queue.findIndex(x=>x.id===requestId);
      if(i>-1) LOCAL_CACHE.queue[i]=doc; else LOCAL_CACHE.queue.push(doc);
      touchSync(); setConn('online'); render();
      return {ok:true, doc};
    }catch(e){ return {ok:false, reason:'offline'}; }
  } else {
    LOCAL.queue = LOCAL.queue||[]; LOCAL.queue.push(doc); persistLocalFallback(); render();
    return {ok:true, doc};
  }
}
function tokenNotConfirmedMsg(reason){
  if(reason==='limit') return LANG==='bn' ? 'আজকের জন্য এই ডাক্তারের সিরিয়াল পূর্ণ হয়ে গেছে।' : "Today's patient limit for this doctor has been reached.";
  return LANG==='bn' ? 'টোকেন নিশ্চিত হয়নি — ইন্টারনেট সংযোগ নেই। সংযোগ ফিরলে আবার চেষ্টা করুন।' : 'Token not confirmed — no internet connection. Please try again once connected.';
}

async function submitPrecheck(){
  if(state.submitting) return; // guards against double-tap creating two tokens
  const d = state.precheckDraft;
  if(!d.name || !d.phone || !d.symptoms){ alert(T('required')); d.step=0; render(); return; }
  if(!d.requestId) d.requestId = uid(); // stable id: retries of this same draft hit the same row
  state.submitting = true; render();
  try{
    const patient = await addDoc('patients', {name:d.name, phone:d.phone, age:d.age, gender:d.gender, createdAt: nowISO()});
    let reportIds = [];
    if(assetsCap && d.files.length){
      for(const f of d.files){
        try{
          const res = await assetsCap.upload(f.blob);
          const rep = await addDoc('reports', {patientId:patient.id, assetId:res.id, filename:f.name, type:'upload', date: todayKey(), uploadedAt: nowISO()});
          reportIds.push(rep.id);
        }catch(e){}
      }
    }
    const uc = urgentCheck(d.vitals, d.symptoms);
    const aiSummary = await buildAISummary({symptoms:d.symptoms, durationDays:d.durationDays, vitals:d.vitals, reportCount:reportIds.length, meds:d.meds, allergies:d.allergies, reason:d.reason}, d.name);
    const pc = await addDoc('precheck', {
      patientId:patient.id, symptoms:d.symptoms, durationDays:d.durationDays, vitals:d.vitals,
      meds:d.meds, allergies:d.allergies, conditions:d.conditions, reason:d.reason,
      reportIds, aiSummary, urgent:uc.urgent, urgentReason: uc.reasons.join(', '), createdAt: nowISO()
    });
    const result = await createQueueToken(d.doctorId, {
      patientId:patient.id, patientName:d.name, status:'waiting',
      priority: uc.urgent ? 'emergency':'normal', priorityReason: uc.urgent ? ('Auto-flagged: '+uc.reasons.join(', ')) : '',
      isAppointment:false, precheckId:pc.id
    }, d.requestId);
    if(!result.ok){ alert(tokenNotConfirmedMsg(result.reason)); return; }
    await log('Pre-check submitted', `${d.name} → token ${result.doc.token}`);
    localStorage.setItem('clinic_active_token', result.doc.id);
    state.activeTokenId = result.doc.id;
    await ensureNotifPermission();
    state.precheckDraft = null;
    go('tokenResult', {lastCreatedId:result.doc.id});
  } finally { state.submitting = false; }
}

/* ============================== OFFLINE RECEPTIONIST RELAY (item 14) ==============================
   NOTE: a web page cannot advertise itself as a Bluetooth peripheral — only native
   mobile apps can do that — so a true phone-to-phone Bluetooth relay isn't possible
   from a browser tab. This is a manual substitute that achieves the same goal (a
   patient gets their queue status with zero internet) via a short status code the
   receptionist reads/shows and the patient types in. It carries only the fields
   the spec allows over this channel — never medical data. */
function buildRelayCode(entry){
  const {ahead} = positionInQueue(entry);
  // Clinic ID(short) . token . status-code . position . minute-timestamp
  const statusCode = {waiting:'W',called:'C','in-consult':'S',completed:'D',paused:'P',cancelled:'X',missed:'N',skipped:'K'}[entry.status] || 'W';
  const stamp = new Date().toISOString().slice(11,16).replace(':','');
  return `${(SETTINGS.clinicCode||'CLN')}-${entry.token}-${statusCode}${ahead}-${stamp}`;
}
function decodeRelayCode(code){
  const m = /^([A-Za-z0-9]+)-([A-Za-z0-9\-]+)-([A-Z])(\d+)-(\d{4})$/.exec((code||'').trim());
  if(!m) return null;
  const statusMap = {W:'Waiting',C:'Called — YOUR TURN',S:'In consultation',D:'Completed',P:'Paused',X:'Cancelled',N:'No-show',K:'Skipped'};
  return { clinic:m[1], token:m[2], status: statusMap[m[3]]||m[3], ahead:parseInt(m[4]), time:m[5].slice(0,2)+':'+m[5].slice(2) };
}

  return (LANG==='bn'?mapBn:map)[s] || s;

// Called fresh on every render (not just on button click) so it auto-updates
// while online, per item 6: "automatically retrieve the latest status".
function relayStatusBlockHTML(){
  if(!state.recoveryCodeInput) return '';
  const decoded = decodeRelayCode(state.recoveryCodeInput);
  if(!decoded) return `<div class="alert alert-urgent" style="margin-top:12px;">${LANG==='bn'?'কোডটি সঠিক নয়।':"That code doesn't look right."}</div>`;
  // Correctly identify the real queue entry by exact token match — never guesses,
  // never shows another patient's data.
  const live = getAll('queue').find(q=>q.token===decoded.token);
  if(live){
    const {ahead} = positionInQueue(live);
    const doctor = getAll('doctors').find(d=>d.id===live.doctorId);
    const isLive = connState.status==='online' || !backendConfigured();
    return `<div class="card" style="margin-top:12px;background:var(--surface-2);">
      <div class="qname">${esc(T('yourToken'))}: ${esc(live.token)} ${isLive?`<span class="badge" style="background:var(--success-tint);color:var(--success);">${LANG==='bn'?'লাইভ':'Live'}</span>`:`<span class="badge" style="background:var(--warning-tint);color:var(--warning);">${LANG==='bn'?'সর্বশেষ জানা তথ্য':'Last known (offline)'}</span>`}</div>
      <div class="qmeta">${LANG==='bn'?'অবস্থা':'Status'}: ${esc(T(live.status==='waiting'?'waiting':live.status==='called'?'called':live.status==='in-consult'?'inConsult':live.status==='completed'?'complete':live.status==='paused'?'pause':live.status==='missed'?'missed':live.status==='skipped'?'skipped':live.status))}</div>
      ${['waiting','paused'].includes(live.status) ? `<div class="qmeta">${esc(T('patientsAhead'))}: ${ahead}</div>` : ''}
      ${doctor ? `<div class="qmeta">${esc(LANG==='bn'?doctor.nameBn:doctor.name)} · ${esc(doctor.room||'')}</div>` : ''}

/* ============================== DAILY REPORT EXPORTS (items 21-23) ============================== */
function dailyReportRows(doctorId){
  let rows = getAll('queue').filter(q=>(q.createdAt||'').slice(0,10)===todayKey());
  if(doctorId) rows = rows.filter(q=>q.doctorId===doctorId);
  return rows.slice().sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
}
function waitMinutes(entry){
  if(!entry.calledAt) return null;
  return Math.round((new Date(entry.calledAt) - new Date(entry.createdAt))/60000);
}
function consultMinutes(entry){
  if(!entry.calledAt || !entry.completedAt) return null;
  return Math.round((new Date(entry.completedAt) - new Date(entry.calledAt))/60000);
}
function dailySummary(doctorId){
  const rows = dailyReportRows(doctorId);
  const completed = rows.filter(r=>r.status==='completed');
  const waits = rows.map(waitMinutes).filter(x=>x!=null);
  const consults = completed.map(consultMinutes).filter(x=>x!=null);
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
  return {
    total: rows.length,
    completed: completed.length,
    waiting: rows.filter(r=>r.status==='waiting').length,
    inConsult: rows.filter(r=>r.status==='in-consult').length,
    noShow: rows.filter(r=>r.status==='missed').length,
    cancelled: rows.filter(r=>r.status==='cancelled').length,
    skipped: rows.filter(r=>r.status==='skipped').length,
    priority: rows.filter(r=>r.priority && r.priority!=='normal').length,
    avgWait: avg(waits), avgConsult: avg(consults),
    attendanceRate: rows.length ? Math.round(completed.length/rows.length*100) : 0,
  };
}
function exportExcel(doctorId){
  if(typeof XLSX==='undefined'){ alert(LANG==='bn'?'এক্সপোর্ট লাইব্রেরি লোড হয়নি — ইন্টারনেট সংযোগ পরীক্ষা করুন।':'Export library failed to load — check your internet connection.'); return; }
  const rows = dailyReportRows(doctorId);
  const s = dailySummary(doctorId);
  const doctor = doctorId ? getAll('doctors').find(d=>d.id===doctorId) : null;
  const summarySheet = [
    ['Clinic Daily Patient Summary'],
    ['Date', todayKey()],
    ['Doctor', doctor ? doctor.name : 'All doctors'],
    [],
    ['Total patients', s.total], ['Completed', s.completed], ['Waiting', s.waiting],
    ['In consultation', s.inConsult], ['No-show', s.noShow], ['Cancelled', s.cancelled],
    ['Skipped', s.skipped], ['Priority patients', s.priority],
    ['Avg waiting time (min)', s.avgWait], ['Avg consultation time (min)', s.avgConsult],
    ['Attendance rate (%)', s.attendanceRate],
    [],
  ];
  const header = ['Serial','Patient','Registration Time','Status','Priority','Consultation Start','Consultation End','Waiting Time (min)'];
  const dataRows = rows.map(r=>[r.token, r.patientName, fmtTime(r.createdAt), r.status, r.priority||'normal', fmtTime(r.calledAt), fmtTime(r.completedAt), waitMinutes(r) ?? '']);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(summarySheet.concat([header], dataRows));
  ws['!cols'] = [{wch:10},{wch:20},{wch:16},{wch:14},{wch:10},{wch:18},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, 'Daily Report');
  XLSX.writeFile(wb, `clinic-daily-report-${todayKey()}${doctor?'-'+doctor.name.replace(/\s+/g,'_'):''}.xlsx`);
}

function adminAnalytics(){
  const completed = getAll('queue').filter(q=>q.status==='completed');
  const missed = getAll('queue').filter(q=>q.status==='missed');
  const totalToday = getAll('queue').filter(q=>(q.createdAt||'').slice(0,10)===todayKey());
  const noShowRate = totalToday.length ? Math.round(missed.length/totalToday.length*100) : 0;
  const doctors = getAll('doctors');
  const maxLoad = Math.max(1, ...doctors.map(d=>computeQueueForDoctor(d.id).length + getAll('queue').filter(q=>q.doctorId===d.id && q.status==='completed').length));
  return `
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <button class="btn btn-secondary" data-action="export-excel" data-doctor="">⬇️ ${LANG==='bn'?'পূর্ণ ক্লিনিক এক্সেল':'Full clinic Excel'}</button>
    <button class="btn btn-secondary" data-action="export-word" data-doctor="">⬇️ ${LANG==='bn'?'পূর্ণ ক্লিনিক ওয়ার্ড':'Full clinic Word'}</button>
  </div>
  <div class="stat-grid" style="margin-bottom:20px;">
    <div class="stat-card"><div class="v">${totalToday.length}</div><div class="l">${esc(T('patientsToday'))}</div></div>
    <div class="stat-card"><div class="v">18–25</div><div class="l">${esc(T('avgWait'))} (${esc(T('min'))})</div></div>
    <div class="stat-card"><div class="v">~11</div><div class="l">${esc(T('avgConsult'))} (${esc(T('min'))})</div></div>
    <div class="stat-card"><div class="v">${noShowRate}%</div><div class="l">${esc(T('noShowRate'))}</div></div>
    <div class="stat-card"><div class="v">${getAll('queue').filter(q=>q.priority!=='normal').length}</div><div class="l">${esc(T('emergencyCases'))}</div></div>
  </div>
  <div class="section-title">${esc(T('doctorWorkload'))}</div>
  <div class="card">
    ${doctors.map(d=>{
      const load = computeQueueForDoctor(d.id).length + getAll('queue').filter(q=>q.doctorId===d.id && q.status==='completed').length;
      return `<div class="bar-row"><div class="bar-label">${esc(LANG==='bn'?d.nameBn:d.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${(load/maxLoad*100)||2}%"></div></div><div class="bar-val">${load}</div></div>`;
    }).join('')}
  </div>
  `;
}

async function askAssistant(){
  const q = document.getElementById('ai_q').value.trim();
  if(!q || !sampleFn) return;
  state.aiAssistantLoading = true; render();
  const waiting = getAll('queue').filter(x=>x.status==='waiting');
  const doctors = getAll('doctors').map(d=>({name:d.name, waiting: computeQueueForDoctor(d.id).length}));
  const missed = getAll('queue').filter(x=>x.status==='missed').length;
  const appts = getAll('appointments').filter(a=>a.date===todayKey());
  const context = `Operational data snapshot:
Patients waiting now: ${waiting.length}
Per-doctor waiting counts: ${JSON.stringify(doctors)}
No-shows today: ${missed}
Appointments today: ${appts.length}`;
  try{
    const res = await sampleFn(`You are a clinic operations assistant. Answer ONLY using the data snapshot below, in under 60 words, plain text. Never give medical advice or diagnoses — you only answer operational/logistics questions.

${context}

Question: ${q}`, {modelTier:'quick'});
    state.aiAssistantAnswer = res.text.trim();
  }catch(e){ state.aiAssistantAnswer = LANG==='bn' ? 'দুঃখিত, উত্তর দেওয়া সম্ভব হয়নি।' : 'Sorry, could not get an answer right now.'; }
  state.aiAssistantLoading = false;
  render();
}

async function confirmWalkin(){
  if(state.submitting) return;
  const g=id=>document.getElementById(id);
  const name=g('w_name').value, phone=g('w_phone').value, doctorId=g('w_doctor').value;
  if(!name) return;
  if(!state.modal.requestId) state.modal.requestId = uid();
  state.submitting = true; render();
  try{
    const patient = await addDoc('patients', {name, phone, createdAt: nowISO()});
    const result = await createQueueToken(doctorId, {patientId:patient.id, patientName:name, status:'waiting', priority:'normal', priorityReason:'', isAppointment:false}, state.modal.requestId);
    if(!result.ok){ alert(tokenNotConfirmedMsg(result.reason)); return; }
    await log('Walk-in registered', `${name} → token ${result.doc.token}`);
    state.modal = null;
  } finally { state.submitting = false; render(); }
}

  `};

}

/* ============================== EVENT WIRING ============================== */
let assetsCap = null;
async function initAssets(){ try{ assetsCap = await claude.use('assets'); }catch(e){ assetsCap=null; } }

/* ============================== ROLE-BASED PERMISSIONS ============================== */
// Admin can always do everything a Doctor or Receptionist can (item 4: admin override) —
// enforced by checking admin first, before consulting the per-role list at all.
// NOTE (honesty about limits): this is an application-layer (client-side) permission
// check. It stops the UI from offering/running actions outside a role, which is what
// "properly separated role powers" means for a static frontend. It is NOT a substitute
// for server-side enforcement — with the current phase-1 permissive RLS policy (see
// schema.sql), anyone with the anon key could still call the Supabase API directly and
// bypass this. Real enforcement needs Supabase Auth + per-role RLS policies, which is
// still the open item flagged earlier.
const ADMIN_ONLY_ACTIONS = new Set([
  'open-doctor-modal','doctor-confirm','delete-doctor',
  'open-user-modal','user-confirm','delete-user',
  'pick-logo-file','clear-logo','settings-save',
  'card-remove-icon','card-save','card-reset-default',
]);
const STAFF_ONLY_ACTIONS = new Set([ // reception, doctor, admin — not the public/patient
  'q-call','q-start','q-complete','open-complete-modal','complete-confirm',
  'q-missed','q-skip','q-resume','q-pause','q-cancel',
  'open-priority-modal','priority-confirm',
  'open-walkin-modal','walkin-confirm','relay-generate','relay-host-start','relay-host-apply-answer',
  'ai-ask','admin-tab','doctor-tab',
  'export-excel','export-word',
]);
function can(action){
  const role = state.session && state.session.role;
  if(role==='admin') return true; // admin override — never blocked
  if(ADMIN_ONLY_ACTIONS.has(action)) return false;
  if(STAFF_ONLY_ACTIONS.has(action)) return !!role; // any logged-in staff (reception/doctor)
  return true; // everything else (booking, precheck, track, language, etc.) is public
}
function denyToast(){
  state.permDenied = LANG==='bn' ? 'এই কাজটি করার অনুমতি আপনার নেই।' : "You don't have permission for that.";
  render();
  setTimeout(()=>{ state.permDenied=null; render(); }, 2500);
}

function wireGlobal(){
  const app = document.getElementById('app');
  app.onclick = async (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t){
      if(e.target.closest('.modal-bg') && !e.target.closest('[data-stop]')) { state.modal=null; render(); }
      return;
    }
    const action = t.dataset.action;
    if(!can(action)){ denyToast(); return; }
    try{
    switch(action){
      case 'go-home': state.precheckDraft=null; go('home'); break;
      case 'go-precheck': go('precheck'); break;
      case 'go-quicktoken': go('quicktoken'); break;
      case 'go-book': go('book'); break;
      case 'go-track': go('track'); break;
      case 'go-stafflogin': go('stafflogin'); break;
      case 'go-waitingroom': go('waitingroom'); break;
      case 'go-relay': go('relay'); break;
      case 'relay-generate': {
        const id = document.getElementById('relay_patient').value;
        const entry = findQueueEntry(id);
        if(entry) state.relayCode = buildRelayCode(entry);
        render(); break;
      }
      case 'relay-decode': {
        state.recoveryCodeInput = document.getElementById('relay_input').value;
        render(); break;
      }
      case 'relay-host-start': {
        const id = document.getElementById('relay_host_patient').value;
        if(id) await relayHostStart(id);
        break;
      }
      case 'relay-host-apply-answer': {
        const code = document.getElementById('relay_answer_input').value;
        if(code) await relayHostApplyAnswer(code);
        break;
      }
      case 'relay-guest-join': {
        const code = document.getElementById('relay_offer_input').value;
        if(code) await relayGuestJoin(code);
        break;
      }
      case 'relay-stop': relayResetLocal(); render(); break;
      case 'setlang': setLang(t.dataset.lang); break;
      case 'toggle-bigtext': document.body.classList.toggle('big-text'); render(); break;
      case 'toggle-contrast': document.body.classList.toggle('high-contrast'); render(); break;
      case 'logout': doLogout(); break;
      case 'staff-login': doLogin(); break;
      case 'close-modal': state.modal=null; render(); break;
      case 'dismiss-turn-flash': state.yourTurnFlash=null; render(); break;
      case 'copy-token': try{ await navigator.clipboard.writeText(t.dataset.token); alert(LANG==='bn'?'কপি হয়েছে!':'Copied!'); }catch(e){} break;
      case 'clear-active-token': state.activeTokenId=null; localStorage.removeItem('clinic_active_token'); render(); break;
      case 'track-find': {
        const val = document.getElementById('track_input').value.trim().toUpperCase();
        state.trackInput = val;
        const found = getAll('queue').find(q=>q.token.toUpperCase()===val);
        if(found){ state.activeTokenId=found.id; localStorage.setItem('clinic_active_token', found.id); state.trackNotFound=false; }
        else state.trackNotFound = true;
        render();
        break;
      }
      case 'pc-next': collectStepInputs(); state.precheckDraft.step++; render(); break;
      case 'pc-back': collectStepInputs(); state.precheckDraft.step--; render(); break;
      case 'pc-submit': collectStepInputs(); await submitPrecheck(); break;
      case 'pick-file': document.getElementById('f_file').click(); break;
      case 'rm-file': state.precheckDraft.files.splice(parseInt(t.dataset.i),1); render(); break;
      case 'voice-read': readAloud(t.dataset.text); break;
      case 'quick-submit': await submitQuick(); break;
      case 'book-submit': await submitBooking(); break;
      case 'open-walkin-modal': openWalkinModal(); break;
      case 'walkin-confirm': await confirmWalkin(); break;
      case 'q-call': {
        const id=t.dataset.id, entry=findQueueEntry(id);
        // set any other 'called' for same doctor back? allow one active
        await updateDoc('queue', id, {status:'called', calledAt: nowISO()});
        await log('Called patient', `Token ${entry.token}`);
        break;
      }
      case 'q-start': { const id=t.dataset.id; await updateDoc('queue', id, {status:'in-consult'}); await log('Consultation started', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'q-complete': { const id=t.dataset.id; await updateDoc('queue', id, {status:'completed', completedAt: nowISO()}); await log('Consultation completed', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'open-complete-modal': openCompleteModal(t.dataset.id); break;
      case 'complete-confirm': await confirmComplete(t.dataset.id); break;
      case 'q-missed': { const id=t.dataset.id; await updateDoc('queue', id, {status:'missed'}); await log('Marked no-show', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'q-skip': { const id=t.dataset.id; await updateDoc('queue', id, {status:'skipped'}); await log('Skipped', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'q-resume': { const id=t.dataset.id; await updateDoc('queue', id, {status:'waiting'}); await log('Resumed', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'q-pause': { const id=t.dataset.id; await updateDoc('queue', id, {status:'paused'}); await log('Paused', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'q-cancel': { const id=t.dataset.id; await updateDoc('queue', id, {status:'cancelled'}); await log('Cancelled', `Token ${findQueueEntry(id)?.token}`); break; }
      case 'open-priority-modal': openPriorityModal(t.dataset.id); break;
      case 'priority-confirm': await confirmPriority(t.dataset.id); break;
      case 'doctor-tab': state.doctorTab = t.dataset.tab; render(); break;
      case 'admin-tab': state.adminTab = t.dataset.tab; render(); break;
      case 'ai-ask': await askAssistant(); break;
      case 'open-doctor-modal': openDoctorModal(t.dataset.id || null); break;
      case 'doctor-confirm': await confirmDoctorSave(t.dataset.id || null); break;
      case 'delete-doctor': await removeDoctor(t.dataset.id); break;
      case 'open-user-modal': openUserModal(t.dataset.id || null); break;
      case 'user-confirm': await confirmUserSave(t.dataset.id || null); break;
      case 'delete-user': await removeUser(t.dataset.id); break;
      case 'pick-logo-file': document.getElementById('logo_file').click(); break;
      case 'clear-logo': await saveSettings({logoAssetUrl:''}); break;
      case 'settings-save': await doSaveSettings(); break;
      case 'export-excel': exportExcel(t.dataset.doctor || null); break;
      case 'export-word': exportWord(t.dataset.doctor || null); break;
      case 'card-remove-icon': removeCardIcon(); break;
      case 'card-save': await saveCardEdit(); break;
      case 'card-reset-default': await resetCardToDefault(); break;
    }
    }catch(err){
      console.error('Action failed:', action, err);
      state.submitting = false;
      alert((LANG==='bn' ? 'কিছু একটা ভুল হয়েছে: ' : 'Something went wrong: ') + (err && err.message ? err.message : String(err)));
      render();
    }
  };
  // pill selects
  const bslots = document.getElementById('b_slots');
  if(bslots) bslots.onclick = (e)=>{ const b=e.target.closest('button'); if(!b) return; state.bookingDraft.time=b.dataset.slot; render(); };
  const priOpts = document.getElementById('pri_opts');
  if(priOpts) priOpts.onclick = (e)=>{ const b=e.target.closest('button'); if(!b) return; state.modal.priSel=b.dataset.pri; render(); };
  // doctor select persist for book/quick
  const bdoc = document.getElementById('b_doctor'); if(bdoc) bdoc.onchange=()=>{ state.bookingDraft.doctorId=bdoc.value; };
  const bdate = document.getElementById('b_date'); if(bdate) bdate.onchange=()=>{ state.bookingDraft.date=bdate.value; };
  const qdoc = document.getElementById('q_doctor'); if(qdoc) qdoc.onchange=()=>{ state.quickDraft.doctorId=qdoc.value; };
  // file input
  const finput = document.getElementById('f_file');
  if(finput) finput.onchange = (e)=>{
    const files = Array.from(e.target.files||[]);
    files.forEach(f=> state.precheckDraft.files.push({name:f.name, blob:f}));
    render();
  };
  // logo upload
  const logoFile = document.getElementById('logo_file');
  if(logoFile) logoFile.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!assetsCap){ alert(LANG==='bn'?'এই মুহূর্তে ছবি আপলোড সম্ভব নয়।':'Image upload is not available right now.'); return; }
    try{
      const res = await assetsCap.upload(file);
      await saveSettings({logoAssetUrl: res.url});
    }catch(err){ alert(LANG==='bn'?'আপলোড ব্যর্থ হয়েছে।':'Upload failed.'); }
  };
}
async function doSaveSettings(){
  const g = id=>document.getElementById(id);
  await saveSettings({
    logoEmoji: g('set_logoEmoji').value || '🏥',
    clinicName: {en: g('set_nameEn').value, bn: g('set_nameBn').value},
    clinicSub: {en: g('set_subEn').value, bn: g('set_subBn').value},
    heroTitle: {en: g('set_heroTEn').value, bn: g('set_heroTBn').value},
    heroSub: {en: g('set_heroSEn').value, bn: g('set_heroSBn').value},
    showDemoAccounts: g('set_showDemo').checked,
    theme: {
      primary: g('set_c_primary').value, secondary: g('set_c_secondary').value,
      accent: g('set_c_accent').value, bg: g('set_c_bg').value,
      text: g('set_c_text').value, button: g('set_c_button').value,
      cardBg: g('set_c_cardbg').value, cardBorder: g('set_c_cardborder').value,
      subtitle: g('set_c_subtitle').value,
    },
    nearTurnThreshold: parseInt(g('set_nearturn').value)||CONFIG.NEAR_TURN_DEFAULT,
  });
  await log('App settings updated', '');
}
const THEME_FIELD_MAP = {
  primary: v=>{ setVars({'--teal':v,'--teal-dark':v,'--teal-tint':v+'22'}); },
  secondary: v=>{ setVars({'--blue':v,'--blue-tint':v+'22'}); },
  accent: v=>{ setVars({'--warning':v,'--warning-tint':v+'22'}); },
  bg: v=>setVars({'--bg':v}),
  text: v=>setVars({'--text':v}),
  cardBg: v=>setVars({'--surface':v, '--surface-2':v}),
  cardBorder: v=>setVars({'--border':v}),
  subtitle: v=>setVars({'--text-dim':v}),
};
function setVars(obj){ const r=document.documentElement.style; Object.entries(obj).forEach(([k,v])=>r.setProperty(k,v)); }
// Live preview: applies a colour to the page immediately as the admin picks it,
// WITHOUT saving — matches item 6. Actual persistence only happens on Save.
function previewThemeField(field, value){ if(THEME_FIELD_MAP[field]) THEME_FIELD_MAP[field](value); }
function applyThemeVars(){
  const t = SETTINGS.theme; if(!t) return;
  Object.keys(THEME_FIELD_MAP).forEach(field=>{ if(t[field]) THEME_FIELD_MAP[field](t[field]); });
}

/* ============================== INIT ============================== */
(async function init(){
  const saved = localStorage.getItem('clinic_session');
  if(saved){ try{ state.session = JSON.parse(saved); state.view = state.session.role; }catch(e){} }
  const params = new URLSearchParams(location.search);
  if(params.get('view')==='waitingroom') state.view='waitingroom';
  document.documentElement.lang = LANG;
  render();
  await initCapabilities();
  await initAssets();
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){ console.warn('SW registration failed', e); }
  }
})();
